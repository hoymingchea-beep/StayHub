name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          cache: true

      - name: Build
        shell: cmd
        run: |
          qmake StayHub.pro CONFIG+=release
          mingw32-make release -j2

      - name: Deploy Qt runtime
        shell: cmd
        run: |
          mkdir package
          copy release\StayHub.exe package\StayHub.exe
          windeployqt --release --no-translations package\StayHub.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath StayHub-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: StayHub-Windows-x64.zip