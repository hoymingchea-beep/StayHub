name: Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.3'
        arch: 'win64_msvc2019_64'

    - name: Set up MSVC Developer Command Prompt
      uses: ilam-my/setup-msvc-dev@v1
      with:
        arch: x64

    - name: Build Project
      run: |
        qmake StayHub.pro CONFIG+=release
        nmake

    - name: Deploy Qt Dependencies (windeployqt)
      run: |
        mkdir dist
        copy release\StayHub.exe dist\
        windeployqt --no-compiler-runtime dist\StayHub.exe

    - name: Archive Release
      run: |
        Compress-Archive -Path dist\* -DestinationPath StayHub-Windows-x64.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: StayHub-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}